name: my_website
description: personal website of Kiumars chaharlangi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  carousel_slider: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0



flutter:
  uses-material-design: true

  # Assets
  assets: 
    - assets/images/
    - assets/icons/
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.ttf
    - family: Quicksand
      fonts: 
        - asset: assets/fonts/Quicksand-Regular.otf
    - family: ProductSans
      fonts:
        - asset: assets/fonts/Product-Sans-Regular.ttf
    - family: NexaBold
      fonts:
        - asset: assets/fonts/Nexa-Bold.otf
    - family: NexaLight
      fonts:
        - asset: assets/fonts/Nexa-Light.otf

